version: 1.0.2
slug: mine_os_nodejs
name: Mine OS NodeJs
description: Mine OS NodeJs Intereface for Home Assistant
arch:
  - aarch64
  - amd64
url: 'https://github.com/Melanchrom/hassio_mineos/mine_os_nodejs'
init: false
webui: http://[HOST]:[PORT:8443]
ports:
  8443/tcp: 8443
  25565/tcp: 25565
  24454/udp: 24454
  5000/tcp: 5000
ports_description:
  8443/tcp: Web Interface
  25565/tcp: Minecraft
  24454/udp: Voice Chat
  5000/tcp: Minecraft Map
host_network: true
map:
  - type: addon_config
    read_only: False
    path: /var/games/minecraft
  - type: share
    read_only: False
options:
  password: null
schema:
  password: password
image: "ghcr.io/melanchrom/mine_os_nodejs"
